name: Build Flutter APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Generate android project
        run: flutter create --platforms=android --org com.almahatta --project-name al_mahatta .
      - name: Apply branding + permissions
        run: |
          cp -r resources/android/res/. android/app/src/main/res/
          cp resources/android/res/drawable/splash.xml android/app/src/main/res/drawable/launch_background.xml
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="المحطة"#' $M
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: AL-MAHATTA-flutter-apk
          path: build/app/outputs/flutter-apk/app-release.apk
